plugins {
	id 'fabric-loom' version '1.10-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {


	maven {
		url = "https://maven.ladysnake.org/releases"
		content {
			includeGroup 'dev.onyxstudios.cardinal-components-api'
		}
	} //cardinal components

	maven {
		url = "https://api.modrinth.com/maven"
		content { includeGroup 'maven.modrinth' }
	}

	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
		content {
			includeGroup 'com.terraformersmc'
		includeGroup("dev.emi")
		}
	}

	maven {
		url = "https://maven.shedaniel.me/"
		content { includeGroup 'me.shedaniel.cloth' }
	} //cloth config

	maven {
		url = 'https://repo.sleeping.town'
		content { includeGroup 'com.unascribed' }
	} //lib39

	maven {
		url = "https://maven.jamieswhiteshirt.com/libs-release"
		content { includeGroup "com.jamieswhiteshirt" }
	} //reach

	maven {url = "https://maven.hexxy.media"}
	maven { url = "https://jitpack.io" } //spectrum
	maven { name = "BlameJared"; url = "https://maven.blamejared.com" } // Hex Casting / Botania API
	maven { name = "Terraformers"; url = "https://terraformersmc.com" }

	mavenCentral()
	maven { url = "https://maven.is-immensely.gay/releases" }
	maven { url = "https://maven.shedaniel.me/" } // Cloth Config, REI
	maven { url = "https://maven.terraformersmc.com/" } // Modmenu, EMI, Trinkets
	maven { url = "https://maven.nucleoid.xyz/" } // Common Protection API
	maven { url = "https://maven.blamejared.com" } // Patchouli
	maven { url = "https://maven.ladysnake.org/releases" } // Cardinal Components API
	maven { url = "https://maven.jamieswhiteshirt.com/libs-release/" } // Entity Reach Attribute
	maven { url = "https://api.modrinth.com/maven" } // Revelationary, Additional Entity Attributes, Fractal Lib, Colorful Hearts
	maven { url = "https://dl.cloudsmith.io/public/klikli-dev/mods/maven/" } // Modonomicon
	maven { url = "https://jitpack.io" } // Spectrum, Arrowhead, Di
}



fabricApi {
	configureDataGeneration()
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"


	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation "vazkii.patchouli:Patchouli:${patchouli_version}"
	modCompileOnly "dev.emi:emi-fabric:${emi_version}:api"
	modLocalRuntime "dev.emi:emi-fabric:${emi_version}"
	modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}"
	modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
	modApi include("com.unascribed:lib39-recoil:${lib39_version}")
	modApi include("com.jamieswhiteshirt:reach-entity-attributes:${reach_version}")
	modApi "me.shedaniel.cloth:cloth-config-fabric:${cloth_version}"
	//modApi "com.terraformersmc:modmenu:${modmenu_version}"
	//the terraformersmc maven is down so we pivot to modrinth for now
	modApi "maven.modrinth:mOgUt4GM:lEkperf6"


	// Botania Fabric
	modCompileOnly "maven.modrinth:botania:1.20.1-441-fabric"

	// Spectrum Fabric
	modCompileOnly "de.dafuqs:spectrum:$spectrum_version"

	//hexcasting fabric
	modCompileOnly("at.petra-k.hexcasting:hexcasting-fabric-$minecraft_version:$hexcasting_version") {
		exclude module: "phosphor"
		exclude module: "lithium"
	}
}


processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

loom {
	runs {
		client {
			programArgs(["--username", "AsterElend", "--uuid", "aba33dbc-b24f-4ba9-8d71-ad15bd4f4bd7"])
		}
	}

	accessWidenerPath = file("src/main/resources/welkin.accesswidener")
}